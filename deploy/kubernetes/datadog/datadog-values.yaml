datadog:
  site: "datadoghq.com"
  clusterName: "griddog-eks"
  apiKeyExistingSecret: "datadog-secret"
  clusterChecks:
    enabled: true
  orchestratorExplorer:
    enabled: true
  tags:
    - "env:k8s"
  apm:
    socketEnabled: true
    hostSocketPath: /var/run/datadog/
    socketPath: /var/run/datadog/apm.socket
  logs:
    enabled: true
    containerCollectAll: true
  networkMonitoring:
    enabled: true
  processAgent:
    processCollection: true

agents:
  tolerations:
    - operator: Exists

clusterAgent:
  admissionController:
    enabled: true
    mutateUnlabelled: true  # ← flip this to false to disable automatic labeling
    failurePolicy: Fail  