# .NET 8 background scheduler — Deployment + Service.
# 2 replicas spread across both backend nodes (anti-affinity).
# CORECLR_* + LD_PRELOAD env vars (for Datadog continuous profiler) are
# baked into the Dockerfile and active even with no agent reachable.
---
apiVersion: v1
kind: Service
metadata:
  name: sg-k8s-dotnet-scheduler
  namespace: griddog
  labels:
    app.kubernetes.io/name: dotnet-scheduler-k8s
    app.kubernetes.io/part-of: griddog
    region: singapore
    env: dev
spec:
  selector:
    app.kubernetes.io/name: dotnet-scheduler-k8s
  ports:
    - name: http
      port: 5000
      targetPort: 5000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sg-k8s-dotnet-scheduler
  namespace: griddog
  labels:
    app.kubernetes.io/name: dotnet-scheduler-k8s
    tags.datadoghq.com/service: "dotnet-scheduler-k8s"
    app.kubernetes.io/part-of: griddog
    region: singapore
    env: dev
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0                        # never add an extra pod during rollout
      maxUnavailable: 1                  # OK to have 1 pod down at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: dotnet-scheduler-k8s
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dotnet-scheduler-k8s
        tags.datadoghq.com/service: "dotnet-scheduler-k8s"
        app.kubernetes.io/part-of: griddog
        region: singapore
        env: dev
    spec:
      nodeSelector:
        griddog.io/role: backend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: dotnet-scheduler-k8s
                topologyKey: kubernetes.io/hostname
      containers:
        - name: dotnet-scheduler
          image: 369042512949.dkr.ecr.ap-southeast-1.amazonaws.com/griddog/dotnet-scheduler:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: ASPNETCORE_URLS
              value: "http://+:5000"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: griddog-secrets
                  key: db_password
            - name: DATABASE_URL
              value: Host=sg-k8s-postgres;Port=5432;Database=griddog;Username=griddog;Password=$(DB_PASSWORD)
            - name: DD_TRACE_AGENT_URL
              value: 'unix:///var/run/datadog/apm.socket'
          volumeMounts:
            - name: apmsocketpath
              mountPath: /var/run/datadog
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - hostPath:
            path: /var/run/datadog/
          name: apmsocketpath