# Go backend (Gin) — Deployment + Service.
# 2 replicas spread across both backend nodes (anti-affinity).
# Talks to java/express/dotnet via in-cluster Service DNS.
---
apiVersion: v1
kind: Service
metadata:
  name: sg-k8s-backend
  namespace: griddog
  labels:
    app.kubernetes.io/name: backend-k8s
    app.kubernetes.io/part-of: griddog
    region: singapore
    env: dev
spec:
  selector:
    app.kubernetes.io/name: backend-k8s
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sg-k8s-backend
  namespace: griddog
  labels:
    app.kubernetes.io/name: backend-k8s
    tags.datadoghq.com/service: "backend-k8s"
    app.kubernetes.io/part-of: griddog
    region: singapore
spec:
  replicas: 2
  strategy:                              # ← NEW BLOCK
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0                        # never add an extra pod during rollout
      maxUnavailable: 1                  # OK to have 1 pod down at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: backend-k8s
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-k8s
        tags.datadoghq.com/service: "backend-k8s"
        app.kubernetes.io/part-of: griddog
        region: singapore
        env: dev
    spec:
      nodeSelector:
        griddog.io/role: backend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: backend-k8s
                topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: 369042512949.dkr.ecr.ap-southeast-1.amazonaws.com/griddog/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: JAVA_SERVICE_URL
              value: http://sg-k8s-java-service:8081
            - name: EXPRESS_SERVICE_URL
              value: http://sg-k8s-express-service:3001
            - name: DOTNET_SCHEDULER_URL
              value: http://sg-k8s-dotnet-scheduler:5000
            - name: TRAFFIC_SERVICE_URL
              value: http://sg-k8s-traffic:3002
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: griddog-secrets
                  key: db_password
            - name: DATABASE_URL
              value: postgres://griddog:$(DB_PASSWORD)@sg-k8s-postgres:5432/griddog?sslmode=disable
            - name: DD_TRACE_AGENT_URL
              value: 'unix:///var/run/datadog/apm.socket'
          volumeMounts:
            - name: apmsocketpath
              mountPath: /var/run/datadog
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - hostPath:
            path: /var/run/datadog/
          name: apmsocketpath
