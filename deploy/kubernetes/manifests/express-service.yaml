# Express service (Node.js) — Deployment + Service.
# 2 replicas spread across both backend nodes (anti-affinity).
---
apiVersion: v1
kind: Service
metadata:
  name: sg-k8s-express-service
  namespace: griddog
  labels:
    app.kubernetes.io/name: express-service-k8s
    app.kubernetes.io/part-of: griddog
    region: singapore
    env: dev
spec:
  selector:
    app.kubernetes.io/name: express-service-k8s
  ports:
    - name: http
      port: 3001
      targetPort: 3001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sg-k8s-express-service
  namespace: griddog
  labels:
    app.kubernetes.io/name: express-service-k8s
    tags.datadoghq.com/service: "express-service-k8s"
    app.kubernetes.io/part-of: griddog
    region: singapore
    env: dev
spec:
  replicas: 2
  strategy:                              # ← NEW BLOCK
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0                        # never add an extra pod during rollout
      maxUnavailable: 1                  # OK to have 1 pod down at a time
  selector:
    matchLabels:
      app.kubernetes.io/name: express-service-k8s
  template:
    metadata:
      labels:
        app.kubernetes.io/name: express-service-k8s
        tags.datadoghq.com/service: "express-service-k8s"
        app.kubernetes.io/part-of: griddog
        region: singapore
        env: dev
    spec:
      nodeSelector:
        griddog.io/role: backend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: express-service-k8s
                topologyKey: kubernetes.io/hostname
      containers:
        - name: express-service
          image: 369042512949.dkr.ecr.ap-southeast-1.amazonaws.com/griddog/express-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: MONGODB_URI
              value: mongodb://sg-k8s-mongodb:27017/griddog
            - name: DD_TRACE_AGENT_URL
              value: 'unix:///var/run/datadog/apm.socket'
          volumeMounts:
            - name: apmsocketpath
              mountPath: /var/run/datadog
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - hostPath:
            path: /var/run/datadog/
          name: apmsocketpath